<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAEC - Học tập AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --green-1:#16a34a;
      --green-2:#15803d;
      --green-3:#0f5d2d;
      --gold:#f5c94d;
      --gold-2:#eeae2b;
      --bg1:#13a047;
      --bg2:#0a7e39;
      --white:#ffffff;
      --text:#173f29;
      --muted:#5d7b66;
      --line:#dfeee3;
      --card:#ffffff;
      --shadow:0 18px 28px rgba(15, 93, 45, 0.14);
    }

    *{ box-sizing:border-box; }
    html,body{
      margin:0;
      width:100%;
      height:100%;
      font-family:'Nunito',sans-serif;
      background:linear-gradient(180deg, var(--bg1), var(--bg2));
      color:var(--text);
    }

    body{
      min-height:100vh;
      overflow:hidden;
    }

    .auth-screen{
      width:100%;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      overflow:hidden;
      background:linear-gradient(180deg, #139b44 0%, #0d7f39 100%);
      padding:18px;
    }

    .auth-screen::before{
      content:"";
      position:absolute;
      width:160px;
      height:160px;
      left:50%;
      top:-20px;
      transform:translateX(-50%);
      background:radial-gradient(circle at 50% 50%, rgba(255,255,255,0.26), rgba(255,255,255,0) 62%);
      border-radius:50%;
      pointer-events:none;
    }

    .auth-box{
      width:min(420px, 100%);
      text-align:center;
      color:#fff;
      position:relative;
      z-index:1;
    }

    .brand{
      margin:0;
      font-family:'Baloo 2', cursive;
      font-size:clamp(2.5rem, 6vw, 3.8rem);
      line-height:0.95;
      letter-spacing:-0.05em;
      font-weight:800;
      word-break:break-word;
    }

    .tagline{
      margin-top:8px;
      font-family:'Baloo 2', cursive;
      font-size:clamp(1rem, 3vw, 1.5rem);
      color:#f3fff7;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .switcher{
      width:min(360px, 100%);
      margin:20px auto 0;
      background:rgba(255,255,255,0.12);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:999px;
      padding:5px;
      display:flex;
      box-shadow:0 10px 18px rgba(0,0,0,0.08);
    }

    .switch-btn{
      flex:1;
      border:none;
      background:transparent;
      padding:11px 12px;
      border-radius:999px;
      color:rgba(255,255,255,0.8);
      font-weight:800;
      font-size:0.96rem;
      cursor:pointer;
      font-family:'Nunito', sans-serif;
      transition:all 0.2s ease;
    }

    .switch-btn.active{
      background:#fff;
      color:var(--green-3);
      box-shadow:0 8px 18px rgba(15,93,45,0.12);
    }

    .card{
      width:min(360px, 100%);
      margin:18px auto 0;
      background:rgba(255,255,255,0.12);
      border:1.5px solid rgba(255,255,255,0.18);
      border-radius:24px;
      padding:18px 16px 14px;
      backdrop-filter:blur(8px);
      box-shadow:0 16px 22px rgba(10,70,30,0.14);
    }

    .field{
      text-align:left;
      margin-bottom:14px;
    }

    .label{
      display:block;
      color:#fff;
      font-weight:800;
      font-size:0.95rem;
      margin-bottom:8px;
    }

    .input{
      width:100%;
      border:none;
      outline:none;
      border-radius:15px;
      background:rgba(255,255,255,0.94);
      color:var(--text);
      font-size:0.98rem;
      padding:14px 14px;
      font-family:'Nunito', sans-serif;
      box-shadow:inset 0 2px 0 rgba(255,255,255,0.85);
    }

    .input::placeholder{
      color:#738a79;
    }

    .primary-btn{
      width:100%;
      border:none;
      border-radius:16px;
      background:linear-gradient(180deg, var(--gold) 0%, var(--gold-2) 100%);
      color:#1f341f;
      font-family:'Nunito', sans-serif;
      font-weight:900;
      font-size:1.05rem;
      padding:14px 12px;
      cursor:pointer;
      box-shadow:0 10px 18px rgba(238,174,43,0.2);
    }

    .message{
      margin-top:12px;
      min-height:22px;
      font-size:0.92rem;
      color:rgba(255,255,255,0.96);
      line-height:1.5;
    }

    .hidden{
      display:none !important;
    }

    .dashboard{
      display:none;
      width:100%;
      height:100vh;
      background:linear-gradient(180deg, #f0fff4 0%, #eafaf0 100%);
      overflow:hidden;
    }

    .topbar{
      height:72px;
      background:#fff;
      border-bottom:2px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 18px;
      box-shadow:0 10px 18px rgba(15,93,45,0.05);
    }

    .logo{
      font-family:'Baloo 2', cursive;
      font-size:1.8rem;
      color:var(--green-3);
      font-weight:800;
    }

    .top-right{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .chip{
      background:linear-gradient(180deg, #f7d557 0%, #efa82d 100%);
      color:#fff;
      border-radius:999px;
      padding:8px 12px;
      font-weight:800;
      font-size:0.8rem;
      box-shadow:0 8px 16px rgba(238,168,45,0.2);
    }

    .avatar{
      width:38px;
      height:38px;
      border-radius:50%;
      background:linear-gradient(180deg,#ebfff1,#cbefd3);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
