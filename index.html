  // =========================
  // COMMON HELPERS
  // =========================
  function makeUID(n, p) {
    return (n.trim().toLowerCase().replace(/\s+/g, "-") + "-" + p).replace(/[^a-z0-9\-]/g, "");
  }

  function getRankFor(pts) {
    let r = RANKS[0];
    for (let i = RANKS.length - 1; i >= 0; i--) {
      if (pts >= RANKS[i].req) {
        r = RANKS[i];
        break;
      }
    }
    return r;
  }

  function hashPin(p) {
    return btoa("kindup-" + p);
  }

  function escHtml(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function timeAgo(ts) {
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return "Vừa xong";
    if (s < 3600) return Math.floor(s / 60) + " phút trước";
    if (s < 86400) return Math.floor(s / 3600) + " giờ trước";
    return Math.floor(s / 86400) + " ngày trước";
  }

  function parseJsonFromText(raw) {
    if (!raw) return null;
    const clean = String(raw).replace(/```json|```/g, "").trim();
    try {
      return JSON.parse(clean);
    } catch (e) {
      const match = clean.match(/\{[\s\S]*\}/);
      if (match) {
        try {
          return JSON.parse(match[0]);
        } catch (e2) {}
      }
    }
    return null;
  }

  function setBtn(id, disabled, text) {
    const el = document.getElementById(id);
    if (!el) return;
    el.disabled = disabled;
    el.textContent = text;
    el.style.opacity = disabled ? "0.7" : "1";
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    if (!t) return;
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => {
      t.classList.remove("show");
    }, 2800);
  }

  function showPointPopup(pts, el) {
    const rect = el ? el.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0 };
    const div = document.createElement("div");
    div.className = "pt-popup";
    div.textContent = "+" + pts + " ⭐";
    div.style.left = (rect.left + rect.width / 2 - 30) + "px";
    div.style.top = rect.top + "px";
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 1700);
  }

  function confetti() {
    const colors = ["#22c55e", "#fbbf24", "#f97316", "#a855f7", "#ec4899", "#3b82f6"];
    for (let i = 0; i < 18; i++) {
      const el = document.createElement("div");
      el.className = "confetti-piece";
      el.style.cssText = `left:${Math.random() * 100}vw;top:0;background:${colors[i % colors.length]};animation-delay:${Math.random() * 0.6}s;animation-duration:${0.9 + Math.random() * 0.5}s;border-radius:${Math.random() > 0.5 ? "50%" : "2px"}`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1800);
    }
  }

  // =========================
  // UI INIT / TABS / NAV
  // =========================
  function initUI() {
    const tabLogin = document.getElementById("tabLogin");
    const tabReg = document.getElementById("tabReg");
    if (tabLogin) tabLogin.addEventListener("click", () => switchTab("login"));
    if (tabReg) tabReg.addEventListener("click", () => switchTab("reg"));

    const btnLogin = document.getElementById("btnLogin");
    const btnReg = document.getElementById("btnReg");
    if (btnLogin) btnLogin.addEventListener("click", doLogin);
    if (btnReg) btnReg.addEventListener("click", doRegister);

    const userAva = document.getElementById("userAva");
    if (userAva) userAva.addEventListener("click", toggleMenu);

    const mainEl = document.querySelector(".main");
    if (mainEl) mainEl.addEventListener("scroll", updateScrollTopBtn, { passive: true });

    const allNav = document.querySelectorAll(".bnav-btn");
    allNav.forEach((btn) => {
      const pageId = btn.id.replace("bn-", "");
      btn.addEventListener("click", () => showPage(pageId));
    });

    if (tabReg) tabReg.style.display = ALLOW_REGISTER ? "" : "none";
    switchTab("login");
  }

  window.switchTab = function (tab) {
    if (tab === "reg" && !ALLOW_REGISTER) {
      showToast("⚠️ Đăng ký tạm thời bị tắt.");
      return;
    }

    const L = tab === "login";
    const formLogin = document.getElementById("formLogin");
    const formReg = document.getElementById("formReg");
    const tL = document.getElementById("tabLogin");
    const tR = document.getElementById("tabReg");

    if (formLogin) formLogin.style.display = L ? "block" : "none";
    if (formReg) formReg.style.display = L ? "none" : "block";

    if (tL) {
      tL.style.background = L ? "white" : "transparent";
      tL.style.color = L ? "var(--green-dark)" : "rgba(255,255,255,.8)";
    }

    if (tR) {
      tR.style.background = L ? "transparent" : "white";
      tR.style.color = L ? "rgba(255,255,255,.8)" : "var(--green-dark)";
      if (ALLOW_REGISTER) tR.style.display = "";
    }
  };

  window.showPage = function (id) {
    _currentPage = id;
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.querySelectorAll(".bnav-btn").forEach(b => b.classList.remove("active"));
    const page = document.getElementById("page-" + id);
    if (page) page.classList.add("active");
    const btn = document.getElementById("bn-" + id);
    if (btn) btn.classList.add("active");

    const mainEl = document.querySelector(".main");
    if (mainEl) mainEl.scrollTop = 0;

    const logoutMenu = document.getElementById("logoutMenu");
    if (logoutMenu) logoutMenu.style.display = "none";

    if (id === "home") {
      refreshHome();
      loadHomeShowcase();
      _aiSuggestLoading = false;
      _aiSuggestions = [];
      loadAiSuggestions();
    }

    if (id === "log") {
      const praiseBox = document.getElementById("praiseBox");
      const praiseTxt = document.getElementById("praiseTxt");
      if (praiseBox) praiseBox.classList.remove("show");
      if (praiseTxt) praiseTxt.innerHTML = "";
      if (!_aiSuggestions.length && !_aiSuggestLoading) loadAiSuggestions();
    }

    if (id === "ranks") loadAchievements();

    updateScrollTopBtn();
  };

  window.toggleMenu = function () {
    const m = document.getElementById("logoutMenu");
    if (!m) return;

  function updateScrollTopBtn() {
    const main = document.querySelector(".main");
    const btn = document.getElementById("scrollTopBtn");
    if (!main || !btn) return;
    btn.classList.toggle("show", main.scrollTop > 320);

  async function doRegister() {
    if (!ALLOW_REGISTER) {
      showToast("⚠️ Đăng ký tạm thời bị tắt.");
      return;
    }
    if (!db) {
      showToast("⚠️ Firebase chưa sẵn sàng, vui lòng thử lại.");
      return;
    }

    const name = document.getElementById("regName").value.trim();
    const pin = document.getElementById("regPin").value.trim();
    const pin2 = document.getElementById("regPin2").value.trim();
    const msg = document.getElementById("regMsg");

    if (!name) {
      msg.textContent = "⚠️ Nhập tên đi bạn!";
      return;
    }
    if (pin.length !== 4 || !/^\d{4}$/.test(pin)) {
      msg.textContent = "⚠️ PIN phải đúng 4 chữ số!";
      return;
    }
    if (pin !== pin2) {
      msg.textContent = "⚠️ Hai PIN không khớp!";
      return;
    }

    const uid = makeUID(name, pin);
    setBtn("btnReg", true, "⏳ Đang kiểm tra...");

    try {
      const snap = await db.ref("users/" + uid).get();
      if (snap.exists()) {
        msg.textContent = "⚠️ Tên + PIN này đã tồn tại!";
        setBtn("btnReg", false, "Tạo tài khoản ✨");
        return;
      }

      const ud = {
        name,
        pin: hashPin(pin),
        uid,
        points: 0,
        weekDone: 0,
        doneToday: [],
        likedPosts: {},
        createdAt: Date.now(),
        emoji: EMOJIS[Math.floor(Math.random() * EMOJIS.length)],
        bg: BG_COLORS[Math.floor(Math.random() * BG_COLORS.length)]
      };

      await db.ref("users/" + uid).set(ud);
      msg.textContent = "✅ Đã tạo tài khoản!";
      setBtn("btnReg", false, "Tạo tài khoản ✨");
      enterApp(ud);
    } catch (err) {
      console.error(err);
      msg.textContent = "⚠️ Lỗi tạo tài khoản, vui lòng thử lại.";
      setBtn("btnReg", false, "Tạo tài khoản ✨");
    }
  }

  async function doLogin() {
    if (!db) {
      showToast("⚠️ Firebase chưa sẵn sàng, vui lòng thử lại.");
      return;
    }

    const name = document.getElementById("loginName").value.trim();
    const pin = document.getElementById("loginPin").value.trim();
    const msg = document.getElementById("loginMsg");

    if (!name || !pin) {
      msg.textContent = "⚠️ Nhập đủ tên và PIN nhé!";
      return;
    }

    const uid = makeUID(name, pin);
    setBtn("btnLogin", true, "⏳ Đang xác nhận...");

    try {
      const snap = await db.ref("users/" + uid).get();
      if (!snap.exists()) {
        msg.textContent = "❌ Không tìm thấy tài khoản!";
        setBtn("btnLogin", false, "Đăng nhập 🚀");
        return;
      }

      const data = snap.val();
      if (data.pin !== hashPin(pin)) {
        msg.textContent = "❌ PIN không đúng!";
        setBtn("btnLogin", false, "Đăng nhập 🚀");
        return;
      }

      setBtn("btnLogin", false, "Đăng nhập 🚀");
      enterApp(data);
    } catch (err) {
      console.error(err);
      msg.textContent = "⚠️ Lỗi đăng nhập, vui lòng thử lại.";
      setBtn("btnLogin", false, "Đăng nhập 🚀");
    }
  }

  function enterApp(data) {
    G.uid = data.uid;
    G.name = data.name;
    G.points = data.points || 0;
    G.weekDone = data.weekDone || 0;
    G.doneToday = Array.isArray(data.doneToday) ? data.doneToday : [];
    G.emoji = data.emoji || "😊";
    G.bg = data.bg || "#bbf7d0";
    G.likedPosts = data.likedPosts || {};
    G.chatHistory = [];

    const today = new Date().toDateString();
    if ((data.lastActiveDay || "") !== today) {
      G.doneToday = [];
      if (db) db.ref("users/" + G.uid).update({ doneToday: [], lastActiveDay: today });
    }

    const setupScreen = document.getElementById("setupScreen");
    const userAva = document.getElementById("userAva");
    const menuUserName = document.getElementById("menuUserName");

    if (setupScreen) setupScreen.style.display = "none";
    if (userAva) userAva.textContent = G.name.charAt(0).toUpperCase();
    if (menuUserName) menuUserName.textContent = "👤 " + G.name;

    initApp();

    subscribeToFeed();
    subscribeToLeaderboard();
    checkAndGenerateStories().catch(err => console.error("[Story] Background generate failed:", err));
    showPage("home");
  }

    if (_modalCmtsUnsub && _modalFeedId) {
      try {
        if (db) db.ref("comments/" + _modalFeedId).off("value", _modalCmtsUnsub);
      } catch (e) {}
      _modalCmtsUnsub = null;
    }

    G = {
      uid: null,
      name: "",
      points: 0,
      weekDone: 0,
      doneToday: [],
      emoji: "😊",
      bg: "#bbf7d0",
      chatHistory: [],
      likedPosts: {}

    const logoutMenu = document.getElementById("logoutMenu");
    if (logoutMenu) logoutMenu.style.display = "none";

    const loginName = document.getElementById("loginName");
    const loginPin = document.getElementById("loginPin");

    if (loginName) loginName.value = "";

    const chatMsgs = document.getElementById("chatMsgs");
    if (chatMsgs) {
      chatMsgs.innerHTML = '<div class="msg ai">Xin chào! 👋 Mình là AI Kindup.<br>Mình có thể giúp bạn:<br>• 💡 Gợi ý việc tốt hôm nay<br>• ⭐ Khen ngợi và động viên<br>• ❓ Vì sao thói quen tốt quan trọng<br><br>Hãy hỏi mình bất cứ điều gì!</div>';

    const feed = document.getElementById("feed");
    const board = document.getElementById("board");
    if (feed) feed.innerHTML = "";
    if (board) board.innerHTML = "";

    switchTab("login");
    const setupScreen = document.getElementById("setupScreen");
    if (setupScreen) setupScreen.style.display = "flex";
  }

  window.logout = logout;

  // =========================
  // APP CORE
  // =========================
  function saveUser() {
    if (!G.uid || !db) return;
    db.ref("users/" + G.uid).update({
      points: G.points,
      weekDone: G.weekDone,
      doneToday: G.doneToday,
      lastActiveDay: new Date().toDateString(),
      likedPosts: G.likedPosts
    });
  }

  function initApp() {
    const h = new Date().getHours();
    const greeting = document.getElementById("greeting");
    if (greeting) {
      greeting.textContent = h < 12 ? "Chào buổi sáng! ☀️" : h < 18 ? "Chào buổi chiều! 🌤️" : "Chào buổi tối! 🌙";
    }

    const d = new Date();
    const days = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
    const subDate = document.getElementById("subDate");
    if (subDate) subDate.textContent = `${G.name} • ${days[d.getDay()]}, ${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;

    renderAll();
    loadHomeShowcase();
    loadAiSuggestions();
  }

  function renderAll() {
    updateProgress();
    renderRanks();
    const ptsChip = document.getElementById("ptsChip");
    if (ptsChip) ptsChip.textContent = `⭐ ${G.points} điểm`;
  }

  function updateProgress() {
    const pts = G.points;
    let rank = RANKS[0], next = RANKS[1];
    for (let i = RANKS.length - 1; i >= 0; i--) {
      if (pts >= RANKS[i].req) {
        rank = RANKS[i];
        next = RANKS[i + 1] || null;
        break;
      }
    }

    const rankName = document.getElementById("rankName");
    const rankPts = document.getElementById("rankPts");
    const pbarFill = document.getElementById("pbarFill");
    const pbarLbl = document.getElementById("pbarLbl");
    const statPts = document.getElementById("statPts");
    const ptsChip = document.getElementById("ptsChip");

    if (rankName) rankName.textContent = `${rank.icon} ${rank.name}`;
    if (ptsChip) ptsChip.textContent = `⭐ ${pts} điểm`;
    if (statPts) statPts.textContent = pts;

    if (next) {
      const pct = Math.min(100, Math.round((pts - rank.req) / (next.req - rank.req) * 100));
      if (pbarFill) pbarFill.style.width = pct + "%";
      if (rankPts) rankPts.textContent = `${pts} / ${next.req} điểm`;
      if (pbarLbl) pbarLbl.textContent = `Còn ${next.req - pts} điểm nữa thành ${next.name}! 💪`;
    } else {
      if (pbarFill) pbarFill.style.width = "100%";
      if (rankPts) rankPts.textContent = "Đã đạt cấp cao nhất!";
      if (pbarLbl) pbarLbl.textContent = "Bạn thật tuyệt vời! 👑";
    }
  }

  // =========================
  // AI SUGGESTIONS
  // =========================
  async function loadAiSuggestions() {
    if (_aiSuggestLoading) return;
    _aiSuggestLoading = true;

    const homeLoading = document.getElementById("homeAiLoading");
    const logLoading = document.getElementById("logTaskLoading");
    const sel = document.getElementById("taskSel");

    if (homeLoading) homeLoading.style.display = "flex";
    if (logLoading) logLoading.style.display = "flex";
    if (sel) sel.style.display = "none";

    const fallback = [
      { name: "Giúp ba mẹ việc nhà", icon: "🧹", reason: "Thể hiện tình yêu gia đình" },
      { name: "Đọc sách 30 phút", icon: "📚", reason: "Mở rộng kiến thức mỗi ngày" },
      { name: "Nói lời cảm ơn với ai đó", icon: "🙏", reason: "Lan tỏa năng lượng tích cực" },
      { name: "Tập thể dục buổi sáng", icon: "🏃", reason: "Giữ sức khoẻ cho ngày dài" },
      { name: "Dọn dẹp góc học tập", icon: "🪴", reason: "Môi trường gọn giúp học tốt hơn" }
    ];

    try {
      if (!db) throw new Error("DB not ready");

      const raw = await callGroq(
        `Gợi ý 5 việc tốt khác nhau cho học sinh Việt Nam hôm nay. Trả về JSON hợp lệ, chỉ JSON, không thêm gì khác: 
        [{"name":"tên việc tốt","icon":"emoji","reason":"lý do ngắn gọn dưới 10 từ"}, ...]`,
        "Bạn là trợ lý AI Kindup. Chỉ trả về JSON array, không có markdown, không có giải thích."
      );

      if (raw) {
        const parsed = parseJsonFromText(raw);
        if (Array.isArray(parsed) && parsed.length) {
          _aiSuggestions = parsed.slice(0, 5);
        } else {
          _aiSuggestions = fallback;
        }
      } else {
        _aiSuggestions = fallback;
      }
    } catch (e) {
      _aiSuggestions = fallback;
    }

    const tasksList = document.getElementById("tasksList");
    if (tasksList) {
      tasksList.innerHTML = _aiSuggestions.map(t => `
        <div class="task-item" onclick="pickSuggestion('${escHtml(t.name)}')">
          <div class="task-ic">${t.icon || "✨"}</div>
          <div class="task-info">
            <div class="task-name">${escHtml(t.name)}</div>
            <div class="task-pts" style="color:var(--muted)">${escHtml(t.reason || "")}</div>
          </div>
          <div class="task-check" style="font-size:.78rem;color:var(--green-dark);font-weight:700">Ghi →</div>
        </div>
      `).join("");
    }

    if (sel) {
      sel.innerHTML = `<option value="">-- Chọn việc tốt --</option>`;
      _aiSuggestions.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t.name;
        opt.textContent = `${t.icon || "✨"} ${t.name}`;
        sel.appendChild(opt);
      });

      const other = document.createElement("option");
      other.value = "__other__";
      other.textContent = "➕ Việc tốt khác (tự nhập)";
      sel.appendChild(other);
      sel.style.display = "block";
    }

    if (homeLoading) homeLoading.style.display = "none";
    if (logLoading) logLoading.style.display = "none";
    _aiSuggestLoading = false;
  }

  window.pickSuggestion = function (taskName) {
    showPage("log");
    const sel = document.getElementById("taskSel");
    if (sel) {
      for (let i = 0; i < sel.options.length; i++) {
        if (sel.options[i].value === taskName) {
          sel.selectedIndex = i;
          break;
        }
      }
      onSelChange();
    }
    const taskDesc = document.getElementById("taskDesc");
    if (taskDesc) taskDesc.focus();
  };

  // =========================
  // FEED + BOARD
  // =========================
  function subscribeToFeed() {
    if (!db || _feedListening) return;
    _feedListening = true;

    db.ref("feed").on("value", snap => {
      const items = [];
      snap.forEach(c => {
        const v = c.val();

        feed.innerHTML = `<div style="text-align:center;color:#ef4444;padding:24px;background:white;border-radius:14px;font-size:.88rem"><b>⚠️ Lỗi tải dữ liệu</b><br>${err.message}<br><small>Kiểm tra Firebase Rules</small></div>`;

    });
  }

      const img = new Image();
      img.onload = () => {
        const MAX = 800;
        let w = img.width, h = img.height;
        if (w > MAX) {
          h = Math.round(h * MAX / w);
          w = MAX;
        }
        if (h > MAX) {
          w = Math.round(w * MAX / h);
          h = MAX;
        }

        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        _photoBase64 = canvas.toDataURL("image/jpeg", 0.75);

        if (prev) {
          prev.src = _photoBase64;
          prev.style.display = "block";

        const placeholder = document.getElementById("photoPlaceholder");
        if (placeholder) placeholder.style.display = "none";

        const removeBtn = document.getElementById("photoRemove");

      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);

  function catOfTask(taskName, desc) {
    const txt = (taskName + " " + (desc || "")).toLowerCase();
    for (const [cat, info] of Object.entries(TASK_CATS)) {
      if (info.keys.some(k => txt.includes(k))) return { name: cat, icon: info.icon };
    }
    return { name: "Khác", icon: "✨" };
  }

  function inferValues(taskName, desc) {
    const txt = (taskName + " " + (desc || "")).toLowerCase();
    const scores = VALUE_BADGES.map(v => ({
      ...v,
      score: v.keys.reduce((sum, key) => sum + (txt.includes(key) ? 1 : 0), 0)
    }));

    const direct = scores.filter(v => v.score > 0).sort((a, b) => b.score - a.score);
    if (direct.length) return direct.slice(0, 2);

    const category = catOfTask(taskName, desc).name;
    const fallbackIds = CATEGORY_TO_VALUES[category] || CATEGORY_TO_VALUES["Khác"];
    return fallbackIds.map(id => VALUE_BADGES.find(v => v.id === id)).filter(Boolean).slice(0, 2);
  }

  function getCurrentWeeklyChallenge(date) {
    const info = getWeekInfo(date || Date.now());
    return WEEKLY_CHALLENGES[(info.week - 1) % WEEKLY_CHALLENGES.length];
  }

  function addDays(date, days) {
    const d = new Date(date);
    d.setDate(d.getDate() + days);
    return d;
  }

  function getStartOfWeek(date) {
    const d = new Date(date || Date.now());
    d.setHours(0, 0, 0, 0);
    const day = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - day);
    return d;
  }

  function getWeekInfo(date) {
    const start = getStartOfWeek(date);
    const thursday = addDays(start, 3);
    const weekYear = thursday.getFullYear();
    const jan4 = new Date(weekYear, 0, 4);
    const firstWeekStart = getStartOfWeek(jan4);
    const week = Math.round((start - firstWeekStart) / 604800000) + 1;
    return { weekYear, week, start };
  }

  function getWeekKey(date) {
    const info = getWeekInfo(date);
    return `${info.weekYear}-W${String(info.week).padStart(2, "0")}`;
  }

  function weekKeyToStartDate(key) {
    const [year, w] = String(key).split("-W");
    const jan4 = new Date(parseInt(year, 10), 0, 4);
    const firstWeekStart = getStartOfWeek(jan4);
    return addDays(firstWeekStart, (parseInt(w, 10) - 1) * 7);
  }

  function weekLabel(key) {
    const [year, w] = String(key).split("-W");
    const monday = weekKeyToStartDate(key);
    const sunday = addDays(monday, 6);
    const fmt = d => `${d.getDate()}/${d.getMonth() + 1}`;
    return `Tuần ${w} • ${fmt(monday)} – ${fmt(sunday)}/${year}`;
  }

  function buildFallbackStory(weekKey, posts, primary) {
    const sorted = [...posts].sort((a, b) => (b.ts || 0) - (a.ts || 0));
    const others = sorted.filter(p => p.id !== primary.id).slice(0, 2);

    const lead = `Trong ${weekLabel(weekKey)}, ${primary.name} đã để lại dấu ấn đẹp với việc "${primary.task}". ${primary.desc || "Hành động nhỏ nhưng mang nhiều ý nghĩa tích cực."}`;
    const support = others.length
      ? others.map(p => `${p.name} cũng góp thêm điều tốt qua "${p.task}"`).join(", ") + "."
      : "Những việc tốt dù nhỏ vẫn có thể làm cho lớp học, gia đình và cộng đồng ấm áp hơn mỗi ngày.";
    const ending = "Mỗi việc tốt được bắt đầu đều có thể truyền cảm hứng để thêm nhiều điều tử tế tiếp tục lan ra.";

    return {
      title: `Điều tử tế nở hoa từ ${primary.name}`,
      content: [lead, support, ending].join("\n\n"),
      tags: ["Tử tế", "Truyền cảm hứng", "Kindup"]
    };
  }

  function listWeeksBetween(minTs, maxTs) {
    if (!Number.isFinite(minTs) || !Number.isFinite(maxTs) || minTs > maxTs) return [];
    const weeks = [];
    let cursor = getStartOfWeek(minTs);
    const end = getStartOfWeek(maxTs);
    while (cursor <= end) {
      weeks.push(getWeekKey(cursor));
      cursor = addDays(cursor, 7);
    }
    return weeks;
  }

  function buildStoryDataset(posts, existingKeys) {
    const validPosts = (posts || []).filter(p => p && Number.isFinite(p.ts)).sort((a, b) => (a.ts || 0) - (b.ts || 0));
    const byWeek = {};
    validPosts.forEach(post => {
      const wk = getWeekKey(post.ts);
      if (!byWeek[wk]) byWeek[wk] = [];
      byWeek[wk].push(post);
    });

    const minTs = validPosts.length ? validPosts[0].ts : null;
    const maxTs = validPosts.length ? validPosts[validPosts.length - 1].ts : null;
    const weeksInRange = listWeeksBetween(minTs, maxTs);
    const currentWeekKey = getWeekKey(Date.now());

    if ((byWeek[currentWeekKey]?.length || 0) > 0 && !weeksInRange.includes(currentWeekKey)) {
      weeksInRange.push(currentWeekKey);
    }

    const completedWeeks = weeksInRange.filter(wk => wk < currentWeekKey);
    const pendingWeeks = weeksInRange.filter(wk => wk > currentWeekKey && (byWeek[wk]?.length || 0) > 0);
    const weeksWithData = weeksInRange.filter(wk => (byWeek[wk]?.length || 0) > 0);
    const missingWeeks = weeksWithData.filter(wk => !existingKeys.has(wk));

    return { validPosts, byWeek, minTs, maxTs, weeksInRange, currentWeekKey, completedWeeks, pendingWeeks, missingWeeks };
  }

  async function getStoryGenerationStatus() {
    const [feedSnap, storySnap] = await Promise.all([db ? db.ref("feed").get() : Promise.resolve(null), db ? db.ref("weeklyStories").get() : Promise.resolve(null)]);
    const posts = [];
    if (feedSnap) {
      feedSnap.forEach(c => {
        const post = c.val();
        if (post) posts.push({ id: c.key, ...post });
      });
    }

    const existingKeys = new Set();
    if (storySnap) {
      storySnap.forEach(c => {
        const val = c.val();
        if (val && typeof val.content === "string" && val.content.trim()) existingKeys.add(c.key);
      });
    }

    const dataset = buildStoryDataset(posts, existingKeys);
    return { ...dataset, existingKeys };
  }

  async function checkAndGenerateStories() {
    if (_storyGeneratingPromise) return _storyGeneratingPromise;
    _storyGenerating = true;

    _storyGeneratingPromise = (async () => {
      try {
        const status = await getStoryGenerationStatus();
        if (!status.validPosts.length || !status.missingWeeks.length) return;

        const missing = status.missingWeeks
          .map(weekKey => [weekKey, status.byWeek[weekKey] || []])
          .filter(([, posts]) => posts.length > 0)
          .sort((a, b) => a[0].localeCompare(b[0]));

        if (!missing.length) return;

        for (const [weekKey, posts] of missing) {
          const snap = await db.ref(`weeklyStories/${weekKey}`).get();
          if (snap.exists() && snap.val()?.content?.trim()) continue;
          await generateWeekStory(weekKey, posts);
          await new Promise(r => setTimeout(r, 400));
        }
      } catch (err) {
        console.error("[Story] checkAndGenerateStories error:", err);
      } finally {
        _storyGenerating = false;
        _storyGeneratingPromise = null;
      }
    })();

    return _storyGeneratingPromise;
  }

  async function generateWeekStory(weekKey, posts) {
    const ranked = [...posts].sort((a, b) => ((b.likes || 0) + (b.pts || 0) * 2 + (b.commentCount || 0)) - ((a.likes || 0) + (a.pts || 0) * 2 + (a.commentCount || 0)));
    const primary = ranked[0];
    if (!primary) return;

    const summary = ranked.slice(0, 12).map((p, i) => `${i + 1}. ${p.name}: "${p.task}" — ${p.desc || ""} (${p.pts || 0} điểm, ❤️${p.likes || 0}, 💬${p.commentCount || 0})`).join("\n");

    const aiRaw = await callGroq(
      `Dữ liệu việc tốt trong ${weekLabel(weekKey)}:\n${summary}`,
      `Bạn là biên tập viên của Kindup – ứng dụng việc tốt mỗi ngày dành cho học sinh Việt Nam. Chỉ trả về JSON: {"title":"...","content":"...","tags":["..."]}`
    );

    const parsed = parseJsonFromText(aiRaw) || buildFallbackStory(weekKey, posts, primary);
    if (!parsed.title || !parsed.content) return;

    const payload = {
      title: parsed.title,
      content: parsed.content,
      tags: Array.isArray(parsed.tags) ? parsed.tags.slice(0, 5) : [],
      generatedAt: Date.now(),
      postCount: posts.length,
      sourcePostId: primary.id || null,
      sourceTask: primary.task || "",
      sourceName: primary.name || ""
    };

    const result = await db.ref(`weeklyStories/${weekKey}`).transaction(current => {
      if (current && typeof current.content === "string" && current.content.trim()) return;
      return payload;
    });

    if (result.committed) console.log(`[Story] ✅ ${weekKey}: "${parsed.title}"`);
    else console.log(`[Story] ⏭️ Bỏ qua ${weekKey}: story đã tồn tại`);
  }

        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({

  function renderHomeImpact(feedItems) {
    const currentWeek = getWeekKey(Date.now());
    const weekItems = (feedItems || []).filter(item => getWeekKey(item.ts) === currentWeek);

    const impactTasks = document.getElementById("impactTasks");
    const impactUsers = document.getElementById("impactUsers");

    if (impactUsers) impactUsers.textContent = String(new Set(weekItems.map(item => item.uid)).size);
    if (impactLikes) impactLikes.textContent = String(weekItems.reduce((sum, item) => sum + (parseInt(item.likes, 10) || 0), 0));

    const challenge = getCurrentWeeklyChallenge(Date.now());
    const userItems = weekItems.filter(item => item.uid === G.uid);
    const progress = countChallengeProgress(challenge, userItems);
    const target = Math.max(1, challenge?.target || 1);
    const pct = Math.min(100, Math.round(progress / target * 100));

    const challengeTitle = document.getElementById("challengeTitle");
    const challengeDesc = document.getElementById("challengeDesc");
    const challengeProgressNum = document.getElementById("challengeProgressNum");
    const challengeFill = document.getElementById("challengeFill");
    const challengeMetaLeft = document.getElementById("challengeMetaLeft");
    const challengeMetaRight = document.getElementById("challengeMetaRight");
    const challengeNote = document.getElementById("challengeNote");

    if (challengeTitle) challengeTitle.textContent = `${challenge.icon} ${challenge.title}`;
    if (challengeDesc) challengeDesc.textContent = challenge.desc;
    if (challengeProgressNum) challengeProgressNum.textContent = `${Math.min(progress, target)}/${target}`;
    if (challengeFill) challengeFill.style.width = pct + "%";
    if (challengeMetaLeft) challengeMetaLeft.textContent = challenge.type === "category" ? `Mục tiêu: ${challenge.category}` : "Mục tiêu: duy trì đều";
    if (challengeMetaRight) challengeMetaRight.textContent = progress >= target ? "Đã hoàn thành" : "Còn " + Math.max(0, target - progress) + " bước nữa";
    if (challengeNote) challengeNote.textContent = challenge.note;
  }

  function countChallengeProgress(challenge, items) {
    if (!challenge) return 0;
    if (challenge.type === "count") return items.length;
    if (challenge.type === "category") {
      return items.filter(item => {
        const category = catOfTask(item.task, item.desc).name;
        if (category === challenge.category) return true;
        const valueIds = inferValues(item.task, item.desc).map(value => value.id);
        return (challenge.valueIds || []).some(id => valueIds.includes(id));
      }).length;
    }
    return 0;
  }

  function calcStreak(history) {
    if (!history.length) return 0;
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const dayKeys = [...new Set(history.map(h => {
      const d = new Date(h.ts);
      d.setHours(0, 0, 0, 0);
      return d.getTime();
    }))].sort((a, b) => b - a);

    let streak = 0;
    for (let i = 0; i < dayKeys.length; i++) {
      const diff = Math.round((today - dayKeys[i]) / 86400000);
      if (diff === i || diff === i + 1) streak++;
      else break;
    }
    return streak;
  }

  function buildValueStats(history) {
    const stats = {};
    VALUE_BADGES.forEach(value => { stats[value.id] = { ...value, count: 0 }; });
    (history || []).forEach(item => {
      inferValues(item.task, item.desc).forEach(value => {
        if (stats[value.id]) stats[value.id].count++;
      });
    });
    return Object.values(stats).sort((a, b) => b.count - a.count);
  }

        items.sort((a, b) => (a.ts || 0) - (b.ts || 0));

        const el = document.getElementById("modalCmtsList");
        if (!el) return;
        if (!items.length) {
          el.innerHTML = '<div style="font-size:.84rem;color:var(--muted);padding:4px 0">Chưa có bình luận nào. Hãy là người đầu tiên!</div>';
          return;
        }
        el.innerHTML = items.map(c => `
          <div class="cmt-item">
            <div class="cmt-ava">${escHtml((c.name || "?").charAt(0).toUpperCase())}</div>
            <div class="cmt-body">
              <div class="cmt-name">${escHtml(c.name)}</div>
              <div class="cmt-text">${escHtml(c.text)}</div>
            </div>
          </div>
        `).join("");

        const wrap = document.getElementById("modalCmtsWrap");
        if (wrap) wrap.scrollTop = wrap.scrollHeight;
      });
    });
  };

  function renderModalInfo(f) {
    const liked = G.likedPosts[f.id] || false;
    const info = document.getElementById("modalInfo");
    if (!info) return;

    info.innerHTML = `
      <div class="fhd" style="margin-bottom:8px">
        <div class="fava" style="background:${escHtml(f.bg || "#bbf7d0")}">${escHtml(f.emoji || "😊")}</div>
        <div>
          <div class="fname">${escHtml(f.name)}</div>
          <div class="ftime">${timeAgo(f.ts)} • ${escHtml(f.rank || "")}</div>
        </div>
      </div>
      <div class="ftag" style="margin-bottom:8px">✅ ${escHtml(f.task)}</div>
      <div class="fdesc" style="margin-bottom:10px">${escHtml(f.desc)}</div>
      ${f.imageUrl ? `<img class="modal-img" src="${escHtml(f.imageUrl)}"/>` : ""}
      <div class="fbtns">
        <button id="modalLikeBtn" class="fbtn ${liked ? "liked" : ""}" data-id="${f.id}" data-likes="${f.likes || 0}" onclick="toggleLike(this,null)">
          ${liked ? "❤️" : "🤍"} ${f.likes || 0}
        </button>
      </div>
    `;
  }

  function updateModalLikeBtn() {
    const btn = document.getElementById("modalLikeBtn");
    if (!btn) return;
    const liked = G.likedPosts[_modalFeedId] || false;
    btn.className = "fbtn " + (liked ? "liked" : "");
    btn.textContent = (liked ? "❤️ " : "🤍 ") + btn.dataset.likes;
  }

  window.closeModal = function (e) {
    if (e.target === document.getElementById("postModal")) closeModalDirect();
  };

  window.closeModalDirect = function () {
    const modal = document.getElementById("postModal");
    if (modal) modal.classList.remove("open");

    if (_modalCmtsUnsub && _modalFeedId) {
      try {
        if (db) db.ref(`comments/${_modalFeedId}`).off("value", _modalCmtsUnsub);
      } catch (e) {}
      _modalCmtsUnsub = null;
    }

    _modalFeedId = null;
    document.getElementById("modalCmtInp").value = "";
  };

  window.modalPostComment = async function () {
    if (!G.uid) {
      showToast("⚠️ Cần đăng nhập!");
      return;
    }
    if (!_modalFeedId || !db) return;

    const inp = document.getElementById("modalCmtInp");
    const text = inp.value.trim();
    if (!text) return;

    inp.value = "";
    await db.ref(`comments/${_modalFeedId}`).push({ uid: G.uid, name: G.name, text, ts: Date.now() });
    db.ref(`feed/${_modalFeedId}/commentCount`).transaction(n => (n || 0) + 1);
  };

  window.toggleLike = async function (btn, e) {
    if (e) e.stopPropagation();
    if (!btn || !db) return;

    const id = btn.dataset.id;
    const liked = G.likedPosts[id] || false;
    const l = parseInt(btn.dataset.likes) || 0;

    if (liked) {
      G.likedPosts[id] = false;
      btn.classList.remove("liked");
      const newL = Math.max(0, l - 1);
      btn.dataset.likes = newL;
      btn.textContent = `🤍 ${newL}`;
      db.ref(`feed/${id}`).update({ likes: newL });
    } else {
      G.likedPosts[id] = true;
      btn.classList.add("liked");
      btn.dataset.likes = l + 1;
      btn.textContent = `❤️ ${l + 1}`;
      db.ref(`feed/${id}`).update({ likes: l + 1 });
    }

    db.ref(`users/${G.uid}/likedPosts`).update({ [id]: G.likedPosts[id] });
    if (_modalFeedId === id) updateModalLikeBtn();
  };

  function refreshHome() {
    if (!G.uid || !db) return;
    db.ref(`users/${G.uid}`).get().then(snap => {
      if (!snap.exists()) return;
      const d = snap.val();
      G.points = d.points || 0;
      G.weekDone = d.weekDone || 0;
      G.doneToday = Array.isArray(d.doneToday) ? d.doneToday : [];
      G.likedPosts = d.likedPosts || {};
      renderAll();
    });
  }

  // =========================
  // START
  // =========================
  document.addEventListener("DOMContentLoaded", () => {
    initUI();
    if (document.getElementById("tabReg")) {
      document.getElementById("tabReg").style.display = ALLOW_REGISTER ? "" : "none";
    }
    if (!db) {
      const loginMsg = document.getElementById("loginMsg");
      const regMsg = document.getElementById("regMsg");
      if (loginMsg) loginMsg.textContent = "⚠️ Firebase chưa kết nối, vui lòng kiểm tra lại mạng.";
      if (regMsg) regMsg.textContent = "⚠️ Firebase chưa kết nối, vui lòng kiểm tra lại mạng.";
    }
  });
</script>
